name: Build Firmware

on:
  push:
    branches: [vial]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli@sha256:16c4916e95b99bf88d27b15aec8db409ee17265d1710287fde248c6666508966

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Configure Git
        run: git config --global --add safe.directory $(pwd)

      - name: Build firmware
        run: qmk compile -kb crkbd -km nodzba

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v3
        with:
          name: firmware
          path: ./.build/crkbd_rev1_nodzba.uf2

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release-${{ github.sha }}
          release_name: Release ${{ github.sha }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./.build/crkbd_rev1_nodzba.uf2
          asset_name: crkbd_rev1_nodzba.uf2
          asset_content_type: application/octet-stream
